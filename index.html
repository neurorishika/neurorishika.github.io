<body>
  <div id="root"><!--app-html--></div>

  <script type="module" src="/src/main.jsx"></script>
  <!-- Ambient flies & ants: never loaded for visitors who prefer reduced motion, and
       hidden + paused if that setting is switched on while the page is open. -->
  <script>
    (function () {
      var mq = window.matchMedia("(prefers-reduced-motion: reduce)"), loaded = false;
      function load() {
        if (loaded) return;
        loaded = true;
        ["/js/flies.js", "/js/ants.js"].forEach(function (src) {
          var s = document.createElement("script"); s.src = src; s.async = false; document.body.appendChild(s);
        });
      }
      function apply() {
        var w = window.__insectWorld = window.__insectWorld || {};
        w.paused = mq.matches;
        document.documentElement.classList.toggle("animals-off", mq.matches);
        if (!mq.matches) load();
      }
      apply();
      if (mq.addEventListener) mq.addEventListener("change", apply);
    })();
  </script>
